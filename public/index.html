<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14161f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>UNO Party</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#14161f; --panel:#1e2130; --panel2:#2a2e42; --text:#f2f3f8; --mute:#9aa0b8; --accent:#ffd23f;
  --red:#e53935; --yellow:#fdd835; --green:#2e9e4f; --blue:#1e78e0;
  --cw:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--panel2);cursor:pointer}
button:active{transform:scale(.97)}
button.primary{background:var(--accent);color:#1b1b1b;font-weight:800}
button.danger{background:#c62828}
button:disabled{opacity:.4}
input{font:inherit;width:100%;padding:13px 14px;border-radius:12px;border:2px solid var(--panel2);background:var(--panel);color:var(--text);outline:none;user-select:text;-webkit-user-select:text}
input:focus{border-color:var(--accent)}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.screen.on{display:flex}
.pad{padding:16px;overflow-y:auto;flex:1}
h1{margin:6px 0 2px;font-size:34px;letter-spacing:-1px}
.sub{color:var(--mute);margin:0 0 18px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.card-box{background:var(--panel);border-radius:16px;padding:14px;margin-bottom:12px}
.lbl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.logo{display:flex;gap:6px;margin:10px 0 4px}
.logo i{display:block;width:34px;height:48px;border-radius:7px;border:2px solid #fff;transform:rotate(calc(var(--r)*1deg))}

/* lobby */
.code{font-size:56px;font-weight:900;letter-spacing:10px;text-align:center;color:var(--accent);margin:2px 0}
.plist{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:8px;background:var(--panel2);padding:9px 12px;border-radius:10px}
.pl .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl small{color:var(--mute)}
.pl button{padding:4px 10px;font-size:13px;background:#3a3f5a}
.tog{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--panel2)}
.tog:first-of-type{border-top:0}
.tog .t{flex:1}
.tog b{display:block}
.tog span{font-size:13px;color:var(--mute)}
.sw{width:46px;height:28px;border-radius:14px;background:#444a66;position:relative;flex:none;margin-top:2px;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:#34c759}.sw.on::after{left:21px}
.ro .sw{opacity:.55;pointer-events:none}
.step{display:flex;align-items:center;gap:10px}
.step button{width:40px;padding:6px}

/* table */
#table{background:radial-gradient(ellipse at 50% 35%,#1f6a45 0%,#124a30 60%,#0b2f1f 100%)}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px}
.top .chip{background:#0006;padding:6px 10px;border-radius:999px;font-weight:800;letter-spacing:2px}
.top .sp{flex:1}
.top button{padding:6px 12px;background:#0006;border-radius:999px}
.opps{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0 8px;max-height:25vh;overflow-y:auto}
.opp{background:#0007;border:2px solid transparent;border-radius:12px;padding:5px 9px;min-width:76px;text-align:center;font-size:12px;position:relative}
.opp b{display:block;font-size:13px;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 auto}
.opp .n{font-size:19px;font-weight:900;line-height:1.1}
.opp.cur{border-color:var(--accent);box-shadow:0 0 14px #ffd23f88}
.opp.off{opacity:.45}
.opp .tag{position:absolute;top:-7px;right:-4px;background:#e53935;font-weight:900;font-size:10px;padding:1px 5px;border-radius:6px}
.mid{flex:1;display:flex;align-items:center;justify-content:center;gap:22px;min-height:120px;position:relative}
.pile{position:relative;text-align:center}
.pile .cnt{font-size:12px;color:#cde;margin-top:4px}
.dirmark{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:22px;opacity:.7}
.topwrap{position:relative;text-align:center}
.ring{position:absolute;inset:-9px;border-radius:16px;border:4px solid var(--c,#fff);box-shadow:0 0 18px var(--c,#fff);pointer-events:none}
.pend{position:absolute;top:-14px;right:-18px;background:#e53935;font-weight:900;padding:2px 9px;border-radius:999px;border:2px solid #fff;font-size:15px;z-index:3}
.played{display:flex;gap:8px;overflow-x:auto;padding:6px 10px;background:#0004;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.played .pc{flex:none;text-align:center;font-size:10px;color:#bcd;width:calc(var(--cw)*.55)}
.played .pc .card{--cw:34px;margin:0 auto 2px}
.played .pc span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#9cb;padding:4px 12px 0;background:#0004}
.banner{text-align:center;padding:7px 10px;font-weight:700;font-size:15px;min-height:34px}
.banner.me{background:var(--accent);color:#1b1b1b;animation:pulse 1.2s infinite}
@keyframes pulse{50%{filter:brightness(1.2)}}
.logl{font-size:12px;color:#bcd;text-align:center;padding:2px 10px 4px;min-height:34px}
.logl div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logl div:last-child{color:#fff}
.hand{display:flex;overflow-x:auto;padding:16px 14px 10px;min-height:calc(var(--cw)*1.5 + 36px);align-items:flex-end;background:linear-gradient(#0000,#0008);-webkit-overflow-scrolling:touch}
.hand .card{flex:none;margin-left:calc(var(--cw)*var(--ov,-.2));transition:transform .12s}
.hand .card:first-child{margin-left:0}
.hand .card.sel{transform:translateY(-16px) scale(1.08);z-index:5}
.hand .card.dim{filter:brightness(.55) saturate(.7)}
.hand .card.drawn{box-shadow:0 0 0 3px #fff,0 0 14px #fff}
.acts{display:flex;gap:8px;padding:4px 10px 10px;align-items:center}
.acts .info{flex:1;font-size:12px;color:#cde;min-height:34px;display:flex;align-items:center}
.acts button{padding:10px 14px;font-weight:800}
.uno{background:#e53935;color:#fff;font-size:18px}
.catch{background:#fff;color:#c62828;animation:pulse .6s infinite}
.mycount{position:absolute;left:12px;bottom:calc(var(--cw)*1.5 + 52px);font-size:11px;color:#bcd}

/* card */
.card{--cw:62px;width:var(--cw);height:calc(var(--cw)*1.5);border-radius:calc(var(--cw)*.14);border:calc(var(--cw)*.045) solid #fff;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #0008;color:#fff;font-weight:900;flex:none;background:#333}
.card.red{background:var(--red)}.card.yellow{background:var(--yellow);color:#2b2300}.card.green{background:var(--green)}.card.blue{background:var(--blue)}
.card.wild{background:conic-gradient(var(--red) 0 25%,var(--blue) 0 50%,var(--green) 0 75%,var(--yellow) 0)}
.card.house{background:linear-gradient(160deg,#3d2a72,#14102b);border-color:#d9c7ff}
.card .m{font-size:calc(var(--cw)*.46);text-shadow:0 2px 0 #0004;line-height:1}
.card .c{position:absolute;font-size:calc(var(--cw)*.2);line-height:1}
.card .c.a{top:calc(var(--cw)*.06);left:calc(var(--cw)*.08)}
.card .c.b{bottom:calc(var(--cw)*.06);right:calc(var(--cw)*.08);transform:rotate(180deg)}
.card.wild .m,.card.house .m{text-shadow:0 0 6px #000a}
.card.house .nm{position:absolute;bottom:calc(var(--cw)*.1);left:0;right:0;text-align:center;font-size:calc(var(--cw)*.14);font-weight:800;line-height:1;padding:0 2px;color:#e8dcff}
.card.house .m{margin-top:calc(var(--cw)*-.15)}
.card.back{background:#1b1b1b;border-color:#fff}
.card.back::after{content:"UNO";color:var(--accent);font-size:calc(var(--cw)*.28);transform:rotate(-20deg);background:var(--red);padding:2px 5px;border-radius:50%}
.card.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.dot{position:absolute;right:-3px;top:-3px;width:calc(var(--cw)*.3);height:calc(var(--cw)*.3);border-radius:50%;border:2px solid #fff}

/* sheets & overlays */
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.on{display:flex}
.sheet{background:var(--panel);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto}
.sheet h3{margin:0 0 4px}
.sheet p{margin:0 0 12px;color:var(--mute);font-size:14px}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.cols button{height:56px;border:3px solid transparent;border-radius:14px}
.cols button.s{border-color:#fff;transform:scale(1.07)}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tg button{display:flex;justify-content:space-between;gap:6px;border:3px solid transparent}
.tg button.s{border-color:var(--accent)}
.center{align-items:center}
.modal{background:var(--panel);border-radius:20px;padding:22px;width:min(92vw,420px);text-align:center;margin:auto}
.win{font-size:42px;margin:0}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 54px);transform:translateX(-50%);background:#000d;padding:10px 16px;border-radius:12px;z-index:100;max-width:88vw;text-align:center;font-size:14px;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.recon{position:fixed;top:0;left:0;right:0;background:#c62828;text-align:center;padding:calc(env(safe-area-inset-top) + 4px) 0 4px;font-size:13px;z-index:200;display:none}
.recon.on{display:block}
.rule{padding:6px 0;border-top:1px solid var(--panel2);font-size:14px}
.rule:first-of-type{border-top:0}
.rule b{margin-right:4px}
@media (max-height:640px){:root{--cw:52px}.mid{min-height:90px}}
@media (min-width:700px){:root{--cw:76px}.screen{max-width:560px;margin:0 auto}}
</style>
</head>
<body>
<div class="recon" id="recon">Reconnecting…</div>
<div class="toast" id="toast"></div>

<!-- HOME -->
<section class="screen on" id="home"><div class="pad">
  <div class="logo"><i style="background:var(--red);--r:-12"></i><i style="background:var(--yellow);--r:-4"></i><i style="background:var(--green);--r:4"></i><i style="background:var(--blue);--r:12"></i></div>
  <h1>UNO Party</h1>
  <p class="sub">Pass-around card game for your friends. Everyone plays on their own phone.</p>
  <div class="card-box">
    <div class="lbl">Your name</div>
    <input id="name" maxlength="14" placeholder="e.g. Anu" autocomplete="off">
  </div>
  <div class="card-box">
    <div class="lbl">Start a new game</div>
    <button class="primary" style="width:100%" id="btnCreate">Create game</button>
  </div>
  <div class="card-box">
    <div class="lbl">Join a friend's game</div>
    <div class="row"><input id="code" maxlength="4" placeholder="CODE" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:6px;text-align:center;font-weight:800"><button class="primary" id="btnJoin">Join</button></div>
  </div>
  <p class="sub" style="font-size:13px">Free prototype · up to <span id="maxp">15</span> players per room · you can join a game that is already running.</p>
</div></section>

<!-- LOBBY -->
<section class="screen" id="lobby"><div class="pad">
  <div class="lbl" style="text-align:center">Room code</div>
  <div class="code" id="lcode">----</div>
  <div class="row" style="margin:6px 0 14px"><button id="btnShare">📤 Invite friends</button><button id="btnLeave">Leave</button></div>
  <div class="card-box"><div class="lbl">Players <span id="pcount"></span></div><div class="plist" id="plist"></div>
    <div class="row" style="margin-top:10px" id="botrow"><button id="btnBot">🤖 Add bot</button></div></div>
  <div class="card-box" id="rules"><div class="lbl">Rules</div><div id="rulebody"></div></div>
  <button class="primary" id="btnStart" style="width:100%;font-size:18px;margin-bottom:10px">Start game</button>
  <div class="sub" id="waitHost" style="text-align:center"></div>
</div></section>

<!-- TABLE -->
<section class="screen" id="table">
  <div class="top"><div class="chip" id="tcode"></div><div class="sp"></div><button id="btnRules">? Rules</button><button id="btnMenu">⋯</button></div>
  <div class="opps" id="opps"></div>
  <div class="mid" id="mid"></div>
  <div class="plbl">Played so far</div>
  <div class="played" id="played"></div>
  <div class="banner" id="banner"></div>
  <div class="logl" id="logl"></div>
  <div class="acts" id="acts"></div>
  <div class="hand" id="hand"></div>
</section>

<!-- overlays -->
<div class="ov" id="ovPick"><div class="sheet" id="pickBody"></div></div>
<div class="ov center" id="ovEnd"><div class="modal" id="endBody"></div></div>
<div class="ov" id="ovRules"><div class="sheet" id="rulesBody"></div></div>
<div class="ov" id="ovMenu"><div class="sheet" id="menuBody"></div></div>

<script>
'use strict';
const COLORS = ['red', 'yellow', 'green', 'blue'];
const CNAME = { red: 'Red', yellow: 'Yellow', green: 'Green', blue: 'Blue' };
let META = { house: {}, max: 15 };
let S = null;                 // latest game state from server
let ws = null, wantOpen = false, retry = 0;
let session = JSON.parse(localStorage.getItem('uno.session') || 'null');
let sel = null;               // selected card id in hand
let pick = null;              // {card,color,target}
let prevTurn = null;

const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (attrs[k] == null || attrs[k] === false) continue;
    if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if (k === 'style') e.style.cssText = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const fill = (el, ...kids) => el.replaceChildren(...kids.flat(Infinity).filter((c) => c != null && c !== false).map((c) => (c.nodeType ? c : document.createTextNode(String(c)))));
function toast(msg, ms = 2200) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), ms); }
function show(id) { for (const s of document.querySelectorAll('.screen')) s.classList.toggle('on', s.id === id); }
const overlay = (id, on) => $(id).classList.toggle('on', on);

// ---------- network ----------
function connect(then) {
  wantOpen = true;
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) { if (ws.readyState === 1 && then) then(); else if (then) ws.addEventListener('open', then, { once: true }); return; }
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => {
    retry = 0; $('recon').classList.remove('on');
    if (session) tx({ t: 'join', code: session.code, pid: session.pid, token: session.token, name: myName() });
    if (then) then();
  };
  ws.onmessage = (ev) => onMsg(JSON.parse(ev.data));
  ws.onclose = () => {
    if (!wantOpen) return;
    $('recon').classList.add('on');
    setTimeout(() => connect(), Math.min(1000 * 2 ** retry++, 6000));
  };
}
const tx = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
setInterval(() => tx({ t: 'ping' }), 25000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && wantOpen && (!ws || ws.readyState > 1)) connect(); });

function onMsg(m) {
  if (m.t === 'joined') {
    session = { code: m.code, pid: m.pid, token: m.token };
    localStorage.setItem('uno.session', JSON.stringify(session));
    history.replaceState(null, '', '?room=' + m.code);
  } else if (m.t === 'state') { S = m; render(); }
  else if (m.t === 'error') {
    toast(m.msg);
    if (m.code === 'noroom') { session = null; localStorage.removeItem('uno.session'); S = null; show('home'); }
  } else if (m.t === 'kicked' || m.t === 'left') { leaveLocal(); if (m.t === 'kicked') toast('You were removed from the room.'); }
}
function leaveLocal() { session = null; S = null; sel = null; localStorage.removeItem('uno.session'); history.replaceState(null, '', location.pathname); overlay('ovEnd', false); overlay('ovMenu', false); show('home'); }

// ---------- cards ----------
function sym(c) {
  switch (c.type) { case 'num': return String(c.value); case 'skip': return '⊘'; case 'reverse': return '⇄'; case 'draw2': return '+2'; case 'wild': return 'W'; case 'wild4': return '+4'; case 'house': return (META.house[c.house] || {}).icon || '★'; }
}
function cardEl(c, o = {}) {
  const cls = ['card', c.type === 'house' ? 'house' : c.type.startsWith('wild') ? 'wild' : c.color];
  if (o.dim) cls.push('dim'); if (o.sel) cls.push('sel'); if (o.drawn) cls.push('drawn');
  const s = sym(c), small = c.type === 'house' || c.type === 'wild' ? '' : s;
  const e = h('div', { class: cls.join(' '), 'data-id': c.id },
    small && h('span', { class: 'c a' }, small), h('span', { class: 'm' }, s), small && h('span', { class: 'c b' }, small),
    c.type === 'house' && h('span', { class: 'nm' }, (META.house[c.house] || {}).name || ''));
  if (o.dot) e.append(h('i', { class: 'dot', style: `background:var(--${o.dot})` }));
  return e;
}
const backEl = () => h('div', { class: 'card back' });
function cardName(c) {
  if (c.type === 'house') return (META.house[c.house] || {}).name;
  const col = c.color ? CNAME[c.color] + ' ' : '';
  return c.type === 'num' ? col + c.value : { skip: col + 'Skip', reverse: col + 'Reverse', draw2: col + '+2', wild: 'Wild', wild4: 'Wild +4' }[c.type];
}
function cardDesc(c) {
  if (c.type === 'house') return META.house[c.house].desc;
  return { num: 'Match the color or the number.', skip: 'Next player loses their turn.', reverse: 'Turn order flips (acts as Skip with 2 players).', draw2: 'Next player draws 2 and loses their turn.', wild: 'Play any time and choose the color.', wild4: 'Next player draws 4 and loses their turn. You choose the color.' }[c.type];
}
const needsColor = (c) => c.type === 'wild' || c.type === 'wild4' || c.type === 'house';
const needsTarget = (c) => c.type === 'house' && META.house[c.house].needs === 'target';
const colorIdx = (c) => (c.color ? COLORS.indexOf(c.color) : 9);
const ORDER = { num: 0, skip: 1, reverse: 2, draw2: 3, wild: 4, wild4: 5, house: 6 };

// ---------- render ----------
function render() {
  if (!S) return;
  const me = S.players.find((p) => p.id === S.you);
  if (S.phase === 'lobby') { show('lobby'); overlay('ovEnd', false); renderLobby(); }
  else { show('table'); renderTable(me); }
}

function toggleRow(title, desc, on, fn, ro) {
  return h('div', { class: 'tog' + (ro ? ' ro' : ''), onclick: ro ? null : fn }, h('div', { class: 't' }, h('b', {}, title), h('span', {}, desc)), h('div', { class: 'sw' + (on ? ' on' : '') }));
}

function renderLobby() {
  const isHost = S.host === S.you, set = S.settings;
  $('lcode').textContent = session ? session.code : '';
  $('pcount').textContent = `(${S.players.length}/${S.max})`;
  const pl = $('plist'); pl.replaceChildren(...S.players.map((p) => h('div', { class: 'pl' },
    h('span', { class: 'nm' }, (p.id === S.host ? '👑 ' : p.bot ? '🤖 ' : '') + p.name + (p.id === S.you ? ' (you)' : '')),
    !p.connected && h('small', {}, 'offline'), p.wins > 0 && h('small', {}, `🏆 ${p.wins}`),
    isHost && p.id !== S.you && h('button', { onclick: () => tx({ t: 'kick', pid: p.id }) }, 'Remove'))));
  $('botrow').style.display = isHost ? '' : 'none';
  const rb = $('rulebody'), ro = !isHost;
  const send = (o) => tx({ t: 'settings', ...o });
  const house = Object.entries(META.house);
  rb.replaceChildren(
    toggleRow('Stack +2 / +4', 'Answer a +2 with another +2 (or +4 with +4) and pass the penalty on.', set.stacking, () => send({ stacking: !set.stacking }), ro),
    toggleRow('Allow joining mid-game', 'Friends can hop into a round that is already running.', set.lateJoin, () => send({ lateJoin: !set.lateJoin }), ro),
    h('div', { class: 'tog' + (ro ? ' ro' : '') }, h('div', { class: 't' }, h('b', {}, 'Starting hand'), h('span', {}, 'Cards each player gets.')),
      h('div', { class: 'step' }, h('button', { onclick: () => !ro && send({ handSize: Math.max(3, set.handSize - 1) }) }, '−'), h('b', {}, set.handSize), h('button', { onclick: () => !ro && send({ handSize: Math.min(10, set.handSize + 1) }) }, '+'))),
    h('div', { class: 'lbl', style: 'margin-top:14px' }, `House cards in the deck (${set.houseCards.length}/${house.length}) · 2 copies each`),
    ...house.map(([k, v]) => toggleRow(`${v.icon} ${v.name}`, v.desc, set.houseCards.includes(k), () => send({ houseCards: set.houseCards.includes(k) ? set.houseCards.filter((x) => x !== k) : [...set.houseCards, k] }), ro)));
  const st = $('btnStart'); st.style.display = isHost ? '' : 'none'; st.disabled = S.players.length < 2;
  st.textContent = S.players.length < 2 ? 'Waiting for another player…' : 'Start game';
  const hostP = S.players.find((p) => p.id === S.host);
  const w = $('waitHost'); w.replaceChildren();
  if (!isHost) { w.append(hostP && hostP.connected ? 'Waiting for the host to start…' : h('button', { onclick: () => tx({ t: 'claimhost' }) }, 'Host is away. Become host')); }
}

function renderTable(me) {
  $('tcode').textContent = session ? session.code : '';
  const myTurn = S.turn === S.you && S.phase === 'playing';
  const meIdx = S.players.findIndex((p) => p.id === S.you);
  const L = S.players.length;
  // opponents in turn order, starting with the player after me
  const opp = []; for (let i = 1; i < L; i++) opp.push(S.players[(meIdx + i * S.dir + L * 20) % L]);
  $('opps').replaceChildren(...opp.map((p) => h('div', { class: 'opp' + (p.id === S.turn ? ' cur' : '') + (p.connected || p.bot ? '' : ' off') },
    p.count === 1 && h('span', { class: 'tag' }, 'UNO'), h('b', {}, (p.bot ? '🤖 ' : '') + p.name), h('div', { class: 'n' }, p.count), h('div', { style: 'color:#bcd' }, p.wins ? `🏆 ${p.wins}` : ' '))));

  // centre: draw pile + top card
  const draw = h('div', { class: 'pile', onclick: () => doDraw() }, backEl(), h('div', { class: 'cnt' }, `${S.drawCount} to draw`));
  if (S.canDraw) draw.firstChild.style.boxShadow = '0 0 0 3px var(--accent),0 0 18px var(--accent)';
  const top = h('div', { class: 'topwrap' }, h('div', { class: 'ring', style: `--c:var(--${S.color})` }), cardEl(S.top, { dot: S.top.color ? null : S.color }), h('div', { class: 'cnt', style: 'font-size:12px;color:#cde;margin-top:4px' }, `Color: ${CNAME[S.color]}`));
  if (S.pending) top.append(h('div', { class: 'pend' }, '+' + S.pending));
  $('mid').replaceChildren(h('div', { class: 'dirmark' }, S.dir === 1 ? '↻' : '↺'), draw, top);

  // played history: shown cards, newest on the right
  const pl = $('played'), atEnd = pl.scrollWidth - pl.scrollLeft - pl.clientWidth < 40;
  pl.replaceChildren(...S.played.map((e) => h('div', { class: 'pc' }, cardEl(e.card, { dot: e.card.color ? null : e.color }), h('span', {}, e.by || 'start'))));
  if (atEnd) pl.scrollLeft = pl.scrollWidth;

  // banner + log
  const cur = S.players.find((p) => p.id === S.turn);
  const bn = $('banner'); bn.className = 'banner' + (myTurn ? ' me' : '');
  bn.textContent = S.phase !== 'playing' ? '' : myTurn ? (S.drawnId ? 'Play the drawn card or pass' : S.pending ? `Stack a draw card or take +${S.pending}` : 'Your turn') : `${cur ? cur.name : ''}'s turn${cur && !cur.connected && !cur.bot ? ' (offline)' : ''}`;
  $('logl').replaceChildren(...S.log.slice(-2).map((t) => h('div', {}, t)));
  if (myTurn && prevTurn !== S.you && navigator.vibrate) navigator.vibrate(120);
  prevTurn = S.turn;

  // hand
  const hand = $('hand'), sx = hand.scrollLeft;
  const sorted = [...S.hand].sort((a, b) => colorIdx(a) - colorIdx(b) || ORDER[a.type] - ORDER[b.type] || (a.value || 0) - (b.value || 0));
  if (sel && !S.hand.some((c) => c.id === sel)) sel = null;
  if (!myTurn) sel = null;
  hand.replaceChildren(...sorted.map((c) => {
    const ok = S.playable.includes(c.id);
    const e = cardEl(c, { dim: myTurn && !ok, sel: sel === c.id, drawn: S.drawnId === c.id });
    e.addEventListener('click', () => onCard(c, ok, e));
    return e;
  }));
  hand.style.setProperty('--ov', S.hand.length <= 6 ? '-.06' : S.hand.length <= 10 ? '-.22' : '-.4');
  hand.scrollLeft = sx;

  // action bar
  const acts = $('acts'); acts.replaceChildren();
  const selC = S.hand.find((c) => c.id === sel);
  acts.append(h('div', { class: 'info' }, selC ? h('span', {}, h('b', {}, cardName(selC)), ' — ', cardDesc(selC)) : `You hold ${S.hand.length} card${S.hand.length === 1 ? '' : 's'}.`));
  if (S.unoWindow && S.unoWindow !== S.you) { const v = S.players.find((p) => p.id === S.unoWindow); acts.append(h('button', { class: 'catch', onclick: () => tx({ t: 'catch' }) }, `Catch ${v.name}!`)); }
  if (S.hand.length <= 2 && me && !me.called) acts.append(h('button', { class: 'uno', onclick: () => tx({ t: 'uno' }) }, 'UNO!'));
  else if (me && me.called && S.hand.length <= 2) acts.append(h('button', { disabled: '' }, 'UNO ✓'));
  if (selC) acts.append(h('button', { class: 'primary', onclick: () => startPlay(selC) }, 'Play'));
  if (S.canPass) acts.append(h('button', { onclick: () => tx({ t: 'pass' }) }, 'Pass'));
  else if (S.canDraw && !selC) acts.append(h('button', { onclick: doDraw }, S.pending ? `Draw ${S.pending}` : 'Draw'));

  renderEnd();
}

function doDraw() { if (S && S.canDraw) tx({ t: 'draw' }); else if (S && S.phase === 'playing') toast(S.turn === S.you ? 'Play or pass first.' : 'Not your turn.'); }

function onCard(c, ok, el) {
  if (S.turn !== S.you) return toast('Not your turn yet.');
  if (!ok) { el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 300); return toast(S.pending ? 'Stack a matching draw card, or draw.' : S.drawnId ? 'You can only play the card you drew.' : 'That one does not match.'); }
  if (sel === c.id) return startPlay(c);
  sel = c.id; renderTable(S.players.find((p) => p.id === S.you));
}

function startPlay(c) {
  if (!needsColor(c) && !needsTarget(c)) { sel = null; return tx({ t: 'play', cardId: c.id }); }
  pick = { card: c, color: null, target: null }; renderPick(); overlay('ovPick', true);
}
function renderPick() {
  const { card } = pick, others = S.players.filter((p) => p.id !== S.you);
  const body = $('pickBody');
  const ready = (!needsColor(card) || pick.color) && (!needsTarget(card) || pick.target);
  fill(body,
    h('h3', {}, cardName(card)), h('p', {}, cardDesc(card)),
    needsColor(card) && h('div', {}, h('div', { class: 'lbl' }, card.house === 'dump' || card.house === 'roulette' ? 'Pick the color (also the new color in play)' : 'Pick the new color'),
      h('div', { class: 'cols' }, COLORS.map((k) => h('button', { class: pick.color === k ? 's' : '', style: `background:var(--${k})`, onclick: () => { pick.color = k; renderPick(); } })))),
    needsTarget(card) && h('div', {}, h('div', { class: 'lbl' }, 'Pick a player'),
      h('div', { class: 'tg' }, others.map((p) => h('button', { class: pick.target === p.id ? 's' : '', onclick: () => { pick.target = p.id; renderPick(); } }, h('span', {}, p.name), h('b', {}, p.count))))),
    h('div', { class: 'row' }, h('button', { onclick: () => overlay('ovPick', false) }, 'Cancel'),
      h('button', { class: 'primary', disabled: ready ? null : '', onclick: () => { overlay('ovPick', false); sel = null; tx({ t: 'play', cardId: card.id, color: pick.color, target: pick.target }); } }, 'Play it')));
  if (!ready) body.querySelector('.primary').setAttribute('disabled', '');
  else body.querySelector('.primary').removeAttribute('disabled');
}

function renderEnd() {
  const on = S.phase === 'ended';
  overlay('ovEnd', on); if (!on) return;
  const w = S.players.find((p) => p.id === S.winner), isHost = S.host === S.you;
  const board = [...S.players].sort((a, b) => b.wins - a.wins);
  fill($('endBody'),
    h('div', { class: 'win' }, w && w.id === S.you ? '🎉' : '🏁'),
    h('h2', { style: 'margin:6px 0' }, w ? (w.id === S.you ? 'You win!' : `${w.name} wins!`) : 'Round over'),
    h('div', { class: 'plist', style: 'margin:14px 0;text-align:left' }, board.map((p) => h('div', { class: 'pl' }, h('span', { class: 'nm' }, p.name + (p.id === S.you ? ' (you)' : '')), h('small', {}, `${p.count} left`), h('b', {}, `🏆 ${p.wins}`)))),
    isHost ? h('div', {}, h('button', { class: 'primary', style: 'width:100%;margin-bottom:8px', onclick: () => tx({ t: 'start' }) }, 'Next round'), h('button', { style: 'width:100%', onclick: () => tx({ t: 'lobby' }) }, 'Back to lobby / change rules')) : h('p', { class: 'sub' }, 'Waiting for the host…'));
}

// ---------- menus ----------
function showRules() {
  const house = S ? S.settings.houseCards : Object.keys(META.house);
  fill($('rulesBody'),
    h('h3', {}, 'How to play'),
    ...[['Match', 'Play a card that matches the top card by color, number or symbol. Wild cards go on anything.'],
      ['Draw', 'No play? Tap the draw pile. If the card you drew fits, you may play it or pass.'],
      ['Skip / Reverse / +2', 'Skip: next player loses a turn. Reverse: flips direction. +2: next player draws 2 and loses a turn.'],
      ['Wild / Wild +4', 'Pick the color. +4 makes the next player draw 4 and lose a turn.'],
      ['UNO!', 'Down to one card? Hit UNO before your turn ends. If someone catches you first, you draw 2.'],
      ['Winning', 'First player to empty their hand wins the round.']].map(([a, b]) => h('div', { class: 'rule' }, h('b', {}, a), b)),
    S && S.settings.stacking && h('div', { class: 'rule' }, h('b', {}, 'Stacking is ON'), 'You can answer +2 with +2 and +4 with +4.'),
    h('h3', { style: 'margin-top:16px' }, 'House cards in this game'),
    house.length ? house.map((k) => h('div', { class: 'rule' }, h('b', {}, `${META.house[k].icon} ${META.house[k].name}`), META.house[k].desc)) : h('p', {}, 'None enabled.'),
    h('button', { style: 'width:100%;margin-top:14px', onclick: () => overlay('ovRules', false) }, 'Close'));
  overlay('ovRules', true);
}
function showMenu() {
  const isHost = S && S.host === S.you;
  fill($('menuBody'),
    h('h3', {}, 'Menu'),
    h('button', { style: 'width:100%;margin-bottom:8px', onclick: () => { overlay('ovMenu', false); share(); } }, '📤 Invite friends'),
    isHost && S.phase === 'playing' && h('button', { style: 'width:100%;margin-bottom:8px', onclick: () => { overlay('ovMenu', false); tx({ t: 'lobby' }); } }, 'End round, back to lobby'),
    h('button', { class: 'danger', style: 'width:100%;margin-bottom:8px', onclick: () => { overlay('ovMenu', false); tx({ t: 'leave' }); } }, 'Leave game'),
    h('button', { style: 'width:100%', onclick: () => overlay('ovMenu', false) }, 'Close'));
  overlay('ovMenu', true);
}
async function share() {
  if (!session) return;
  const url = `${location.origin}/?room=${session.code}`;
  const text = `Join my UNO game! Code: ${session.code}`;
  try { if (navigator.share) return await navigator.share({ title: 'UNO Party', text, url }); } catch (e) { return; }
  try { await navigator.clipboard.writeText(`${text}\n${url}`); toast('Invite link copied'); } catch { toast(url, 5000); }
}

// ---------- wiring ----------
const myName = () => ($('name').value.trim() || localStorage.getItem('uno.name') || 'Player');
function needName() { const n = $('name').value.trim(); if (!n) { $('name').focus(); toast('Type your name first.'); return null; } localStorage.setItem('uno.name', n); return n; }
$('btnCreate').onclick = () => { const n = needName(); if (n) connect(() => tx({ t: 'create', name: n })); };
$('btnJoin').onclick = () => { const n = needName(); const c = $('code').value.trim().toUpperCase(); if (!n) return; if (c.length !== 4) return toast('Enter the 4-letter code.'); session = null; connect(() => tx({ t: 'join', code: c, name: n })); };
$('btnShare').onclick = share;
$('btnLeave').onclick = () => tx({ t: 'leave' });
$('btnBot').onclick = () => tx({ t: 'bot' });
$('btnStart').onclick = () => tx({ t: 'start' });
$('btnRules').onclick = showRules;
$('btnMenu').onclick = showMenu;
for (const id of ['ovPick', 'ovRules', 'ovMenu']) $(id).addEventListener('click', (e) => { if (e.target.id === id) overlay(id, false); });

(async function init() {
  try { META = await (await fetch('/meta')).json(); } catch {}
  $('maxp').textContent = META.max;
  $('name').value = localStorage.getItem('uno.name') || '';
  const q = new URLSearchParams(location.search).get('room');
  if (q) $('code').value = q.toUpperCase().slice(0, 4);
  if (session && (!q || q.toUpperCase() === session.code)) connect();   // resume after refresh / phone sleep
  else if (q) { session = null; localStorage.removeItem('uno.session'); }
})();
</script>
</body>
</html>
